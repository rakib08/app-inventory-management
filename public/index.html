<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Phone Inventory</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
</head>

<body class="bg-light">

  <div class="container py-4">

    <!-- Header -->
    <div class="mb-4">
      <h1 class="h3 mb-1">Phone Inventory</h1>
      <p class="text-muted mb-0">Manage your phone stock</p>
    </div>

    <!-- Message area -->
    <div id="msg" class="mb-3"></div>

    <!-- Add Phone Form -->
    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <h2 class="h5 mb-3">Add Phone</h2>

        <form id="phoneForm">
          <div class="row g-3">
            <div class="col-12 col-md-6">
              <label for="brand" class="form-label">Brand</label>
              <input type="text" id="brand" class="form-control" placeholder="Apple" required />
            </div>

            <div class="col-12 col-md-6">
              <label for="model" class="form-label">Model</label>
              <input type="text" id="model" class="form-control" placeholder="iPhone 13" required />
            </div>

            <div class="col-12 col-md-3">
              <label for="ram" class="form-label">RAM (GB)</label>
              <input type="number" id="ram" class="form-control" placeholder="4" min="0" required />
            </div>

            <div class="col-12 col-md-3">
              <label for="storage" class="form-label">Storage (GB)</label>
              <input type="number" id="storage" class="form-control" placeholder="128" min="0" required />
            </div>

            <div class="col-12 col-md-6">
              <label for="color" class="form-label">Color</label>
              <input type="text" id="color" class="form-control" placeholder="Blue" required />
            </div>

            <div class="col-12 col-md-4">
              <label for="purchasePrice" class="form-label">Purchase Price</label>
              <input type="number" id="purchasePrice" class="form-control" placeholder="65000" min="0" step="0.01" required />
            </div>

            <div class="col-12 col-md-4">
              <label for="sellingPrice" class="form-label">Selling Price</label>
              <input type="number" id="sellingPrice" class="form-control" placeholder="75000" min="0" step="0.01" required />
            </div>

            <div class="col-12 col-md-2">
              <label for="quantity" class="form-label">Quantity</label>
              <input type="number" id="quantity" class="form-control" placeholder="5" min="0" required />
            </div>

            <div class="col-12 col-md-2">
              <label for="status" class="form-label">Status</label>
              <select id="status" class="form-select" required>
                <option value="in_stock" selected>in_stock</option>
                <option value="reserved">reserved</option>
                <option value="sold">sold</option>
              </select>
            </div>

            <div class="col-12 d-flex gap-2 mt-2">
              <button type="submit" class="btn btn-primary">Add Phone</button>
              <button type="reset" class="btn btn-outline-secondary">Reset</button>
            </div>
          </div>
        </form>

      </div>
    </div>

    <!-- Search / Filter -->
    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <h2 class="h5 mb-3">Search</h2>

        <div class="row g-3 align-items-end">
          <div class="col-12 col-md-5">
            <label for="searchBrand" class="form-label">Brand</label>
            <input type="text" id="searchBrand" class="form-control" placeholder="apple" />
          </div>

          <div class="col-12 col-md-5">
            <label for="searchModel" class="form-label">Model</label>
            <input type="text" id="searchModel" class="form-control" placeholder="iphone" />
          </div>

          <div class="col-12 col-md-2 d-grid gap-2">
            <button id="searchBtn" class="btn btn-dark" type="button">Search</button>
            <button id="clearBtn" class="btn btn-outline-dark" type="button">Clear</button>
          </div>
        </div>

      </div>
    </div>

    <!-- Phones Table -->
    <div class="card shadow-sm">
      <div class="card-body">
        <div class="d-flex align-items-center justify-content-between mb-3">
          <h2 class="h5 mb-0">Phones</h2>
          <button id="refreshBtn" class="btn btn-outline-primary btn-sm" type="button">Refresh</button>
        </div>

        <div class="table-responsive">
          <table class="table table-striped table-bordered align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th style="width: 70px;">ID</th>
                <th>Brand</th>
                <th>Model</th>
                <th style="width: 90px;">RAM</th>
                <th style="width: 110px;">Storage</th>
                <th>Color</th>
                <th>Purchase</th>
                <th>Selling</th>
                <th style="width: 100px;">Qty</th>
                <th style="width: 120px;">Status</th>
                <th style="width: 130px;">Actions</th>
              </tr>
            </thead>

            <tbody id="phonesTbody">
              <!-- JS render -->
            </tbody>
          </table>
        </div>

      </div>
    </div>

  </div>

  <script src="main.js"></script>
</body>
</html>
